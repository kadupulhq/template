name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    uses: kadupulhq/.github/.github/workflows/release.yml@06f43be3b86dab323c1492a61b73538e51539256
    # Turning on tarball or image below also needs packages: write,
    # id-token: write and attestations: write here. A called workflow can only
    # narrow the caller's token, never widen it.
    permissions:
      contents: write
